<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hoco?</title>
<style>
  :root {
    --bg1: #ffe3ec;
    --bg2: #ffd0e0;
    --pink: #ff5c8a;
    --pink-dark: #d63b6b;
    --ink: #4a2036;
    --muted: #a06783;
    --paper: #fff6f9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  /* floating background hearts */
  .bg-heart {
    position: fixed;
    bottom: -40px;
    z-index: 0;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(-45deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.35; }
    100% { transform: translateY(-110vh) rotate(-45deg); opacity: 0; }
  }

  .confetti-piece {
    position: fixed;
    top: -20px;
    z-index: 5;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }

  .heart {
    width: 22px;
    height: 22px;
    background: var(--pink);
    position: relative;
    transform: rotate(-45deg);
    display: inline-block;
  }
  .heart::before, .heart::after {
    content: "";
    width: 22px;
    height: 22px;
    background: var(--pink);
    border-radius: 50%;
    position: absolute;
  }
  .heart::before { top: -11px; left: 0; }
  .heart::after { left: 11px; top: 0; }

  .stage {
    width: 100%;
    max-width: 400px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .top-heart {
    width: 26px;
    height: 26px;
    margin: 0 auto 20px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .top-heart .heart { width: 26px; height: 26px; }
  .top-heart .heart::before, .top-heart .heart::after { width: 26px; height: 26px; }
  .top-heart .heart::before { top: -13px; }
  .top-heart .heart::after { left: 13px; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .card {
    background: var(--paper);
    border-radius: 26px;
    padding: 48px 32px;
    box-shadow: 0 18px 40px rgba(214, 59, 107, 0.18);
    animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes cardIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0 0 36px;
    line-height: 1.4;
    color: var(--pink-dark);
  }

  .buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    min-height: 60px;
  }

  button {
    font-family: Georgia, serif;
    font-size: 1rem;
    padding: 13px 30px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  #yesBtn {
    background: var(--pink);
    color: white;
    font-weight: 700;
    animation: gentleBounce 2.4s ease-in-out infinite;
  }

  #yesBtn:hover {
    background: var(--pink-dark);
    box-shadow: 0 8px 20px rgba(214, 59, 107, 0.35);
    transform: translateY(-2px);
  }

  @keyframes gentleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  #noBtn {
    background: #ffe6ee;
    color: var(--pink-dark);
    position: relative;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
  }

  .hidden {
    display: none;
  }

  .aw-message {
    margin-top: 18px;
    font-size: 0.9rem;
    color: var(--pink-dark);
    font-style: italic;
    min-height: 20px;
  }

  /* Receipt */
  .receipt {
    text-align: center;
  }

  .hearts-row {
    margin-bottom: 18px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .hearts-row .heart { width: 18px; height: 18px; animation: popIn 0.5s ease backwards; }
  .hearts-row .heart::before, .hearts-row .heart::after { width: 18px; height: 18px; }
  .hearts-row .heart::before { top: -9px; }
  .hearts-row .heart::after { left: 9px; }
  .hearts-row .heart:nth-child(1) { animation-delay: 0.05s; }
  .hearts-row .heart:nth-child(2) { animation-delay: 0.2s; }
  .hearts-row .heart:nth-child(3) { animation-delay: 0.35s; }

  @keyframes popIn {
    0% { transform: rotate(-45deg) scale(0); opacity: 0; }
    70% { transform: rotate(-45deg) scale(1.2); opacity: 1; }
    100% { transform: rotate(-45deg) scale(1); opacity: 1; }
  }

  .receipt .banner {
    font-size: 2rem;
    font-weight: 700;
    color: var(--pink-dark);
    letter-spacing: 0.01em;
    line-height: 1.3;
    margin-bottom: 14px;
    animation: bannerIn 0.5s ease 0.4s backwards;
  }

  @keyframes bannerIn {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  .receipt .line {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 6px;
  }

  .receipt .timestamp {
    margin-top: 26px;
    font-size: 0.8rem;
    color: #c98fac;
  }

  .screenshot-hint {
    margin-top: 22px;
    font-size: 0.9rem;
    color: var(--pink);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="top-heart"><span class="heart"></span></div>

  <div id="askCard" class="card">
    <h1>hey, will you go to homecoming with me?</h1>
    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">yes, of course</button>
      <button id="noBtn" onclick="handleNo()">no</button>
    </div>
    <p id="awMessage" class="aw-message"></p>
  </div>

  <div id="receiptCard" class="card receipt hidden">
    <div class="hearts-row">
      <span class="heart"></span><span class="heart"></span><span class="heart"></span>
    </div>
    <div class="banner">SHE SAID YES!</div>
    <p class="line">homecoming is officially happening</p>
    <div class="timestamp" id="timestampVal"></div>
    <p class="screenshot-hint">screenshot this and show everyone</p>
  </div>

</div>

<script>
  let noClicks = 0;

  function handleNo() {
    noClicks++;
    const btn = document.getElementById('noBtn');
    const msg = document.getElementById('awMessage');
    const container = document.querySelector('.buttons');

    if (noClicks < 3) {
      msg.textContent = ":(";
      const maxX = container.clientWidth - btn.offsetWidth - 10;
      const x = Math.random() * maxX - maxX / 2;
      const y = (Math.random() * 40) - 20;
      btn.style.position = 'relative';
      btn.style.transform = `translate(${x}px, ${y}px)`;
    } else {
      msg.textContent = ":( okay, no it is.";
      btn.style.transform = 'none';
      btn.onclick = null;
      btn.style.cursor = 'default';
      btn.style.opacity = '0.6';
    }
  }

  function sayYes() {
    document.getElementById('askCard').classList.add('hidden');
    document.getElementById('receiptCard').classList.remove('hidden');

    const now = new Date();
    document.getElementById('timestampVal').textContent =
      now.toLocaleDateString() + ' · ' + now.toLocaleTimeString();
  }

  // spawn floating background hearts
  function spawnBgHeart() {
    const heart = document.createElement('div');
    heart.className = 'bg-heart';
    heart.innerHTML = '<span class="heart"></span>';
    heart.style.left = Math.random() * 100 + 'vw';
    const size = 12 + Math.random() * 14;
    heart.style.transform = `scale(${size / 22})`;
    const duration = 7 + Math.random() * 6;
    heart.style.animationDuration = duration + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000);
  }

  setInterval(spawnBgHeart, 900);
</script>

</body>
</html>
